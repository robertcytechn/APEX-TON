<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Error 500 | BinsurMX</title>
    <style>
        :root {
            --fondo: #fff7f5;
            --tarjeta: #ffffff;
            --texto: #40181a;
            --detalle: #7a4a4c;
            --marca: #c33f32;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 80% 10%, #ffe6df 0%, var(--fondo) 42%);
            color: var(--texto);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .panel {
            width: min(92vw, 720px);
            background: var(--tarjeta);
            border: 1px solid #f2d5d1;
            border-radius: 18px;
            padding: 34px 28px;
            box-shadow: 0 18px 40px rgba(109, 24, 16, 0.14);
        }
        .codigo {
            font-size: 64px;
            line-height: 1;
            margin: 0;
            letter-spacing: 1px;
            color: var(--marca);
        }
        h1 {
            margin: 14px 0 8px;
            font-size: 28px;
        }
        p {
            margin: 0 0 22px;
            color: var(--detalle);
            font-size: 17px;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            background: var(--marca);
            color: #fff;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
        }
        small {
            display: block;
            margin-top: 14px;
            color: var(--detalle);
        }
    </style>
</head>
<body>
    <main class="panel">
        <p class="codigo">500</p>
        <h1>Ocurrio un error interno del servidor</h1>
        <p>No fue posible completar tu solicitud en este momento. Nuestro equipo ya puede revisar el incidente.</p>
        <a href="/apex/">Volver al inicio de BinsurMX</a>
        <small>BinsurMX | Pagina de error personalizada</small>
    </main>
</body>
</html>
