<VirtualHost *:80>
    ServerName localhost 

    # ==========================================
    # PROYECTO 1: SISTEMA APEX
    # ==========================================
    
    # 1. FRONTEND (VUE 3)
    # Cuando alguien entre a /apex, Apache buscará en esta carpeta:
    Alias /apex "C:/xampp/htdocs/apex/front/dist"
    <Directory "C:/xampp/htdocs/apex/front/dist">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Reglas de Vue Router adaptadas para la sub-ruta /apex/
        RewriteEngine On
        RewriteBase /apex/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /apex/index.html [L]
    </Directory>

    # 2. BACKEND (DJANGO API & ADMIN)
    # Interceptamos /apex/api/ y se lo pasamos a Waitress (Puerto 8000)
    # Nota: Waitress seguirá recibiendo /api/ limpio gracias a la magia del ProxyPass
    ProxyPass /apex/api/ http://localhost:8000/api/
    ProxyPassReverse /apex/api/ http://localhost:8000/api/
    
    ProxyPass /apex/admin/ http://localhost:8000/admin/
    ProxyPassReverse /apex/admin/ http://localhost:8000/admin/

    # 3. ARCHIVOS ESTÁTICOS DE DJANGO
    Alias /apex/static/ "C:/xampp/htdocs/apex/back/staticfiles/"
    <Directory "C:/xampp/htdocs/apex/back/staticfiles/">
        Require all granted
    </Directory>

    # ==========================================
    # PROYECTO 2: FUTURO (Ejemplo para cuando lo necesites)
    # ==========================================
    # Alias /casinos "C:/Proyectos/Casinos/frontend/dist"
    # ProxyPass /casinos/api/ http://localhost:8001/api/ 
    # (Usarías el puerto 8001 para el Waitress del segundo proyecto)

</VirtualHost>