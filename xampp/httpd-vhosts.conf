<VirtualHost *:80>
    ServerName cytechn.ddns.net

    # Redirige todo el trafico hacia la version segura
    Redirect permanent / https://cytechn.ddns.net/
</VirtualHost>

<VirtualHost *:443>
    ServerName cytechn.ddns.net

    SSLEngine on
    SSLCertificateFile "C:/certificadoCytechn/cytechn_ddns_net.pem"
    SSLCertificateKeyFile "C:/certificadoCytechn/llave_limp.key"

    # ==========================================
    # PAGINAS DE ERROR PERSONALIZADAS
    # Las paginas viven dentro de /apex/errores junto con el frontend.
    # ==========================================
    ProxyErrorOverride On
    ErrorDocument 401 /apex/errores/acceso-no-autorizado.html
    ErrorDocument 403 /apex/errores/acceso-no-autorizado.html
    ErrorDocument 404 /apex/errores/no-encontrado.html
    ErrorDocument 500 /apex/errores/error-servidor.html
    ErrorDocument 502 /apex/errores/error-servidor.html
    ErrorDocument 503 /apex/errores/error-servidor.html
    ErrorDocument 504 /apex/errores/error-servidor.html

    # ==========================================
    # PROYECTO 1: SISTEMA APEX
    # ==========================================

    # 1. FRONTEND (VUE 3)
    # Cuando alguien entre a /apex, Apache buscará en esta carpeta.
    Alias /apex "C:/xampp/htdocs/apex/front/"
    <Directory "C:/xampp/htdocs/apex/front/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Reglas de Vue Router adaptadas para la sub-ruta /apex/
        RewriteEngine On
        RewriteBase /apex/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /apex/index.html [L]
    </Directory>

    # 2. BACKEND (DJANGO API & ADMIN)
    # Interceptamos /apex/api/ y se lo pasamos a Waitress (Puerto 8000).
    ProxyPass /apex/api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /apex/api/ http://127.0.0.1:8000/api/

    ProxyPass /apex/administrator/ http://127.0.0.1:8000/admin/
    ProxyPassReverse /apex/administrator/ http://127.0.0.1:8000/admin/

    # 3. ARCHIVOS ESTATICOS DE DJANGO
    Alias /apex/static/ "C:/xampp/htdocs/apex/back/staticfiles/"
    <Directory "C:/xampp/htdocs/apex/back/staticfiles/">
        Options -Indexes
        Require all granted
    </Directory>

    # ==========================================
    # PROYECTO 2: FUTURO (Ejemplo para cuando lo necesites)
    # ==========================================
    # Alias /casinos "C:/Proyectos/Casinos/frontend/dist"
    # ProxyPass /casinos/api/ http://localhost:8001/api/
    # (Usarias el puerto 8001 para el Waitress del segundo proyecto)
</VirtualHost>