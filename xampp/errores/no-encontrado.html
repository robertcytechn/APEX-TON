<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Error 404 | BinsurMX</title>
    <style>
        :root {
            --fondo: #f4f6fb;
            --tarjeta: #ffffff;
            --texto: #12213f;
            --detalle: #637295;
            --marca: #2f5bd3;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 20% 20%, #dde6ff 0%, var(--fondo) 45%);
            color: var(--texto);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .panel {
            width: min(92vw, 720px);
            background: var(--tarjeta);
            border: 1px solid #d9e1f4;
            border-radius: 18px;
            padding: 34px 28px;
            box-shadow: 0 18px 40px rgba(17, 38, 88, 0.14);
        }
        .codigo {
            font-size: 64px;
            line-height: 1;
            margin: 0;
            letter-spacing: 1px;
            color: var(--marca);
        }
        h1 {
            margin: 14px 0 8px;
            font-size: 28px;
        }
        p {
            margin: 0 0 22px;
            color: var(--detalle);
            font-size: 17px;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            background: var(--marca);
            color: #fff;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
        }
        small {
            display: block;
            margin-top: 14px;
            color: var(--detalle);
        }
    </style>
</head>
<body>
    <main class="panel">
        <p class="codigo">404</p>
        <h1>La pagina que buscabas no existe</h1>
        <p>La direccion solicitada no se encontro en el servidor. Verifica la URL o vuelve al inicio de la aplicacion.</p>
        <a href="/apex/">Ir al inicio de BinsurMX</a>
        <small>BinsurMX | Pagina de error personalizada</small>
    </main>
</body>
</html>
